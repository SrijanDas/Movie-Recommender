name: Migrate database

on:
  push:
    branches: [main]
    paths:
      - "drizzle/**"
      - "lib/db/schema.ts"
      - "drizzle.config.ts"
  workflow_dispatch:

# Never run two migrations against the same database at once.
concurrency:
  group: db-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.2

      - run: bun install --frozen-lockfile

      - run: bun run db:migrate
        env:
          # Supabase session pooler (port 5432) — drizzle-kit migrates more reliably through it.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
